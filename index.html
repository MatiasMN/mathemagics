  :root {
    --board: #eef0ea;
    --board2: #e2e5db;
    --ink: #23303b;
    --ink-soft: #5b6b70;
    --accent: #c14e34;
    --line: #c9cdbf;
    --good: #3f7a52;
    --bad: #b5432f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --board: #1c2b25;
      --board2: #223129;
      --ink: #f4f1e8;
      --ink-soft: #a9b8ac;
      --accent: #e8c468;
      --line: #3a4a3f;
      --good: #9fd6a8;
      --bad: #e08b74;
    }
  }
  :root[data-theme="dark"] {
    --board: #1c2b25;
    --board2: #223129;
    --ink: #f4f1e8;
    --ink-soft: #a9b8ac;
    --accent: #e8c468;
    --line: #3a4a3f;
    --good: #9fd6a8;
    --bad: #e08b74;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--board);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }

  h1 {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(28px, 8vw, 38px);
    margin: 0 0 6px;
    letter-spacing: 0.3px;
  }
  .tagline { font-family: 'Kalam', cursive; color: var(--ink-soft); margin: 0 0 22px; font-size: 16px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .chip.active { border-color: var(--accent); color: var(--ink); background: var(--board2); font-weight: 600; }

  .card {
    background: var(--board2);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size: 14px 14px;
    opacity: 0.35;
    pointer-events: none;
  }

  .technique-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; position: relative; }

  .problem {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(24px, 7.5vw, 40px);
    text-align: center;
    padding: 10px 0 24px;
    position: relative;
    overflow-wrap: anywhere;
  }
  .problem.long { font-family: 'Inter', sans-serif; font-weight: 600; font-size: clamp(20px, 5.5vw, 28px); }

  form.answer-row { display: flex; gap: 10px; position: relative; }
  input[type="number"] {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--board);
    color: var(--ink);
    min-width: 0;
  }
  input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.submit {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--board);
    cursor: pointer;
  }
  button.submit:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .weekday-buttons { display: none; flex-wrap: wrap; gap: 8px; position: relative; }
  .weekday-buttons.show { display: flex; }
  button.wd {
    flex: 1 1 22%;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 6px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--board);
    color: var(--ink);
    cursor: pointer;
  }
  button.wd:active { transform: scale(0.97); }

  .feedback { min-height: 26px; margin-top: 14px; font-size: 15px; font-weight: 600; position: relative; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .trick-toggle {
    background: none; border: none; color: var(--ink-soft);
    text-decoration: underline; text-underline-offset: 3px;
    font-size: 13px; padding: 0; margin-top: 16px; cursor: pointer; position: relative;
  }
  .trick-body { margin-top: 10px; font-size: 14px; line-height: 1.55; color: var(--ink-soft); display: none; position: relative; }
  .trick-body.open { display: block; }
  .trick-body b { color: var(--ink); }
  .trick-body .example-line { color: var(--ink); font-weight: 600; margin-bottom: 8px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; }
  .stat { text-align: center; border-top: 1px dashed var(--line); padding-top: 10px; }
  .stat .num { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .skip { text-align: center; margin-top: 18px; }
  .skip button { background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

  .offline-note { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 28px; min-height: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mathemagics</h1>
  <p class="tagline">Mental math tricks from Arthur Benjamin — practice until they're reflexes.</p>

  <div class="chips" id="chips"></div>

  <div class="card">
    <div class="technique-label" id="techLabel"></div>
    <div class="problem" id="problem">–</div>

    <form class="answer-row" id="answerForm" autocomplete="off">
      <input type="number" inputmode="numeric" id="answerInput" placeholder="your answer" aria-label="Your answer" required>
      <button class="submit" type="submit">Check</button>
    </form>

    <div class="weekday-buttons" id="weekdayButtons">
      <button class="wd" type="button" data-idx="0">Sun</button>
      <button class="wd" type="button" data-idx="1">Mon</button>
      <button class="wd" type="button" data-idx="2">Tue</button>
      <button class="wd" type="button" data-idx="3">Wed</button>
      <button class="wd" type="button" data-idx="4">Thu</button>
      <button class="wd" type="button" data-idx="5">Fri</button>
      <button class="wd" type="button" data-idx="6">Sat</button>
    </div>

    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="trick-toggle" id="trickToggle" type="button">Show the trick</button>
    <div class="trick-body" id="trickBody"></div>
  </div>

  <div class="skip"><button id="skipBtn" type="button">Skip to a new problem</button></div>

  <div class="stats">
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">streak</div></div>
    <div class="stat"><div class="num" id="statBest">0</div><div class="lbl">best streak</div></div>
    <div class="stat"><div class="num" id="statAcc">–</div><div class="lbl">accuracy</div></div>
    <div class="stat"><div class="num" id="statAvg">–</div><div class="lbl">avg time</div></div>
  </div>

  <div class="offline-note" id="offlineNote"></div>
</div>

<script>
(function() {
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  const ordinal = (n) => {
    const s = ["th","st","nd","rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };

  const techniques = {
    mixed: { name: "Mixed practice" },

    times11: {
      name: "Multiply by 11",
      gen() {
        const a = rand(10, 98);
        return { text: `${a} × 11 = ?`, answer: a * 11, ctx: { a } };
      },
      trick(ctx) {
        const d = String(ctx.a).split("").map(Number);
        const sum = d[0] + d[1];
        return `Split <b>${ctx.a}</b> into ${d[0]} and ${d[1]}. Add them: ${d[0]}+${d[1]} = ${sum}.
        ${sum < 10
          ? `Slide that sum between the two digits: <b>${d[0]}${sum}${d[1]} = ${ctx.a * 11}</b>.`
          : `That's 10 or more, so write the last digit (${sum % 10}) in the middle and carry 1 into the first digit: <b>${(d[0] + 1)}${sum % 10}${d[1]} = ${ctx.a * 11}</b>.`}`;
      }
    },

    squareEnd5: {
      name: "Square numbers ending in 5",
      gen() {
        const n = rand(1, 12);
        const num = n * 10 + 5;
        return { text: `${num}² = ?`, answer: n * (n + 1) * 100 + 25, ctx: { n, num } };
      },
      trick(ctx) {
        return `Take the leading digit(s) <b>${ctx.n}</b>, multiply by one more than itself: ${ctx.n} × ${ctx.n + 1} = ${ctx.n * (ctx.n + 1)}.
        Stick <b>25</b> on the end: <b>${ctx.n * (ctx.n + 1)}25</b>.`;
      }
    },

    squareAny: {
      name: "Square any 2-digit number",
      gen() {
        let a;
        do { a = rand(11, 99); } while (a % 10 === 5);
        const toNext10 = 10 - (a % 10);
        const toPrev10 = a % 10;
        const d = toNext10 <= toPrev10 ? toNext10 : -toPrev10;
        return { text: `${a}² = ?`, answer: a * a, ctx: { a, d } };
      },
      trick(ctx) {
        const { a, d } = ctx;
        const up = a + d, down = a - d;
        return `Round to the nearest 10 by moving <b>${d > 0 ? "up" : "down"} ${Math.abs(d)}</b>: ${a} becomes ${up}; move the same amount the other way to get ${down}.
        Multiply those: ${up} × ${down} = ${up * down}. Then add back ${Math.abs(d)}² = ${d * d}.
        ${up * down} + ${d * d} = <b>${a * a}</b>.`;
      }
    },

    near100: {
      name: "Multiply numbers near 100",
      gen() {
        let x, y;
        do { x = rand(-9, 9); } while (x === 0);
        do { y = rand(-9, 9); } while (y === 0);
        const a = 100 + x, b = 100 + y;
        return { text: `${a} × ${b} = ?`, answer: a * b, ctx: { a, b, x, y } };
      },
      trick(ctx) {
        const { a, b, x, y } = ctx;
        return `Each number's distance from 100: ${a} is ${x >= 0 ? "+" + x : x}, ${b} is ${y >= 0 ? "+" + y : y}.
        Cross-add: ${a} ${y >= 0 ? "+" : "−"} ${Math.abs(y)} = ${a + y}; that's your hundreds (${a + y}00).
        Multiply the distances: ${x} × ${y} = ${x * y}.
        ${a + y}00 ${x * y >= 0 ? "+" : "−"} ${Math.abs(x * y)} = <b>${a * b}</b>.`;
      }
    },

    subFrom1000: {
      name: "Subtract from 1000",
      gen() {
        let num;
        do { num = rand(100, 999); } while (num % 10 === 0);
        return { text: `1000 − ${num} = ?`, answer: 1000 - num, ctx: { num } };
      },
      trick(ctx) {
        const d = String(ctx.num).split("").map(Number);
        const ans = 1000 - ctx.num;
        return `Subtract the first two digits from <b>9</b>, and the last digit from <b>10</b>:
        9−${d[0]}=${9 - d[0]}, 9−${d[1]}=${9 - d[1]}, 10−${d[2]}=${10 - d[2]}.
        Answer: <b>${ans}</b>.`;
      }
    },

    multiplyBy5: {
      name: "Multiply by 5",
      gen() {
        const n = rand(12, 986);
        return { text: `${n} × 5 = ?`, answer: n * 5, ctx: { n } };
      },
      trick(ctx) {
        const { n } = ctx;
        if (n % 2 === 0) {
          const half = n / 2;
          return `×5 is the same as ×10, then ÷2. <b>${n}</b> is even, so halve it first: ${n} ÷ 2 = ${half}.
          Now put a zero on the end: <b>${half * 10}</b>.`;
        } else {
          const m = (n - 1) / 2;
          return `×5 is the same as ×10, then ÷2. <b>${n}</b> is odd, so halve ${n - 1} instead: ${m}.
          Put a zero on the end and add 5 for the leftover half: ${m * 10} + 5 = <b>${m * 10 + 5}</b>.`;
        }
      }
    },

    sameTensUnitsSum10: {
      name: "Same tens, units sum to 10",
      gen() {
        const t = rand(1, 9);
        let u;
        do { u = rand(1, 9); } while (u === 5);
        const a = t * 10 + u, b = t * 10 + (10 - u);
        return { text: `${a} × ${b} = ?`, answer: a * b, ctx: { t, u, a, b } };
      },
      trick(ctx) {
        const { t, u, a, b } = ctx;
        return `Both numbers share tens digit <b>${t}</b>, and their units (${u} and ${10 - u}) add to 10; that's what makes this work.
        Multiply the tens digit by one more than itself: ${t} × ${t + 1} = ${t * (t + 1)} (hundreds).
        Multiply the units: ${u} × ${10 - u} = ${u * (10 - u)}.
        Add them: ${t * (t + 1)}00 + ${u * (10 - u)} = <b>${a * b}</b>.`;
      }
    },

    cubeRoot: {
      name: "Cube root of a perfect cube",
      gen() {
        const n = rand(10, 99);
        return { text: `∛${(n ** 3).toLocaleString("en-US")} = ?`, answer: n, ctx: { n, cube: n ** 3 } };
      },
      trick(ctx) {
        const { n, cube } = ctx;
        const lastDigit = n % 10;
        const cubeLast = cube % 10;
        const tens = Math.floor(n / 10) * 10;
        const pairs = "0↔0, 1↔1, 2↔8, 3↔7, 4↔4, 5↔5, 6↔6, 7↔3, 8↔2, 9↔9";
        const upper = tens + 10;
        return `Memorize the cubes of 1–9; their last digits pair up uniquely (${pairs}).
        The cube <b>${cube.toLocaleString("en-US")}</b> ends in <b>${cubeLast}</b>, so the root ends in <b>${lastDigit}</b>.
        For the tens digit, ignore the last three digits and look at what's left (${Math.floor(cube / 1000)}): it falls between ${tens / 10}³ = ${(tens / 10) ** 3} and ${upper / 10}³ = ${(upper / 10) ** 3}, so the tens digit is <b>${tens / 10}</b>.
        Put them together: <b>${n}</b>.`;
      }
    },

    dayOfWeek: {
      name: "Day of the week",
      long: true,
      gen() {
        const y = rand(2000, 2099);
        const m = rand(1, 12);
        const daysInMonth = new Date(y, m, 0).getDate();
        const d = rand(1, daysInMonth);
        const weekday = new Date(y, m - 1, d).getDay();
        return { text: `${MONTH_NAMES[m - 1]} ${d}, ${y}`, answer: weekday, ctx: { y, m, d } };
      },
      trick(ctx) {
        const { y, m, d } = ctx;
        const yy = y % 100;
        const anchor = 2; // Tuesday: doomsday anchor for 2000–2099
        const a = Math.floor(yy / 12);
        const b = yy % 12;
        const c = Math.floor(b / 4);
        const doomsdayIdx = (anchor + a + b + c) % 7;
        const monthDoomsday = {
          1: isLeap(y) ? 4 : 3, 2: isLeap(y) ? 29 : 28, 3: 14, 4: 4, 5: 9, 6: 6,
          7: 11, 8: 8, 9: 5, 10: 10, 11: 7, 12: 12
        };
        const refDate = monthDoomsday[m];
        const diff = d - refDate;
        const resultIdx = ((doomsdayIdx + diff) % 7 + 7) % 7;
        return `Every year has a "doomsday" weekday: 4/4, 6/6, 8/8, 10/10, 12/12, 5/9, 9/5, 7/11, 11/7, 3/14 and the last day of February all fall on it.
        For <b>${y}</b>: last two digits = ${yy}. Divide by 12: ${a} remainder ${b}. Divide that remainder by 4: ${c}.
        Century anchor (Tuesday = 2) + ${a} + ${b} + ${c} = ${anchor + a + b + c}; mod 7 gives ${doomsdayIdx}, so doomsday is <b>${DAY_NAMES[doomsdayIdx]}</b>.
        The doomsday in ${MONTH_NAMES[m - 1]} is the ${ordinal(refDate)}. The ${ordinal(d)} is ${Math.abs(diff)} day${Math.abs(diff) === 1 ? "" : "s"} ${diff >= 0 ? "after" : "before"} that,
        so count ${diff >= 0 ? "forward" : "back"} from ${DAY_NAMES[doomsdayIdx]}: <b>${DAY_NAMES[resultIdx]}</b>.`;
      }
    }
  };

  const order = ["mixed", "times11", "squareEnd5", "squareAny", "near100", "subFrom1000", "multiplyBy5", "sameTensUnitsSum10", "cubeRoot", "dayOfWeek"];

  const state = {
    mode: "mixed", current: null, key: null,
    streak: 0, best: 0, correct: 0, total: 0,
    startTime: 0, totalTime: 0, timedCount: 0, answered: false
  };

  try {
    const saved = JSON.parse(localStorage.getItem("mathemagics-stats") || "{}");
    if (typeof saved.best === "number") state.best = saved.best;
    if (typeof saved.mode === "string" && techniques[saved.mode]) state.mode = saved.mode;
  } catch (e) {}

  const chipsEl = document.getElementById("chips");
  order.forEach(key => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (key === state.mode ? " active" : "");
    btn.textContent = techniques[key].name;
    btn.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      state.mode = key;
      saveStats();
      newProblem();
    });
    chipsEl.appendChild(btn);
  });

  const problemEl = document.getElementById("problem");
  const techLabelEl = document.getElementById("techLabel");
  const feedbackEl = document.getElementById("feedback");
  const trickBody = document.getElementById("trickBody");
  const trickToggle = document.getElementById("trickToggle");
  const answerInput = document.getElementById("answerInput");
  const answerForm = document.getElementById("answerForm");
  const weekdayButtons = document.getElementById("weekdayButtons");

  function pickKey() {
    if (state.mode !== "mixed") return state.mode;
    const keys = order.filter(k => k !== "mixed");
    return keys[rand(0, keys.length - 1)];
  }

  function newProblem() {
    const key = pickKey();
    const tech = techniques[key];
    const q = tech.gen();
    state.key = key;
    state.current = q;
    state.answered = false;
    problemEl.textContent = q.text;
    problemEl.classList.toggle("long", !!tech.long);
    techLabelEl.textContent = tech.long ? `${tech.name}: which weekday is it?` : tech.name;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    trickBody.classList.remove("open");
    trickBody.innerHTML = "";
    trickToggle.textContent = "Show the trick";

    if (key === "dayOfWeek") {
      answerForm.style.display = "none";
      weekdayButtons.classList.add("show");
    } else {
      answerForm.style.display = "flex";
      weekdayButtons.classList.remove("show");
      answerInput.value = "";
      answerInput.focus({ preventScroll: true });
    }
    state.startTime = performance.now();
  }

  function renderStats() {
    document.getElementById("statStreak").textContent = state.streak;
    document.getElementById("statBest").textContent = state.best;
    document.getElementById("statAcc").textContent = state.total ? Math.round((state.correct / state.total) * 100) + "%" : "–";
    document.getElementById("statAvg").textContent = state.timedCount ? (state.totalTime / state.timedCount / 1000).toFixed(1) + "s" : "–";
  }

  function saveStats() {
    try { localStorage.setItem("mathemagics-stats", JSON.stringify({ best: state.best, mode: state.mode })); } catch (e) {}
  }

  function registerResult(isCorrect, elapsed, correctLabel) {
    if (state.answered) return;
    state.total++;
    if (isCorrect) {
      state.answered = true;
      state.correct++;
      state.streak++;
      state.best = Math.max(state.best, state.streak);
      state.totalTime += elapsed;
      state.timedCount++;
      feedbackEl.textContent = "Correct. Next one coming.";
      feedbackEl.className = "feedback good";
      saveStats();
      renderStats();
      setTimeout(newProblem, 650);
    } else {
      state.streak = 0;
      feedbackEl.textContent = `Not quite. The answer is ${correctLabel}.`;
      feedbackEl.className = "feedback bad";
      renderStats();
    }
  }

  answerForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (answerInput.value.trim() === "") return;
    const val = Number(answerInput.value);
    registerResult(val === state.current.answer, performance.now() - state.startTime, state.current.answer);
  });

  weekdayButtons.addEventListener("click", (e) => {
    const btn = e.target.closest("button.wd");
    if (!btn) return;
    const idx = Number(btn.dataset.idx);
    registerResult(idx === state.current.answer, performance.now() - state.startTime, DAY_NAMES[state.current.answer]);
  });

  trickToggle.addEventListener("click", () => {
    if (!trickBody.classList.contains("open")) {
      const tech = techniques[state.key];
      let example, tries = 0;
      do { example = tech.gen(); tries++; }
      while (example.answer === state.current.answer && tries < 20);

      const exampleLabel = state.key === "dayOfWeek"
        ? `${example.text} falls on a ${DAY_NAMES[example.answer]}`
        : example.text.replace(" = ?", ` = ${example.answer}`);

      trickBody.innerHTML = `<div class="example-line">Example: ${exampleLabel}</div>` + tech.trick(example.ctx);
      trickBody.classList.add("open");
      trickToggle.textContent = "Hide the trick";
    } else {
      trickBody.classList.remove("open");
      trickToggle.textContent = "Show the trick";
    }
  });

  document.getElementById("skipBtn").addEventListener("click", newProblem);

  // Offline support: cache the app on first visit so it opens with no connection.
  const note = document.getElementById("offlineNote");
  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      note.textContent = "Saved for offline use.";
    }).catch(() => {});
  }

  renderStats();
  newProblem();
})();
</script>
</body>
</html>
